services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: organiza_dev
      POSTGRES_USER: organiza
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Configure DEV_DB_PASSWORD no .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dev_db:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organiza -d organiza_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dev_db:
